<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cocktails</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" type="image/png" href="/images/cocktail-favicon.png" />
  </head>
  <body class="background">
    <header>
      <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container-fluid">
          <a id="home-button" class="navbar-brand text-light" href="#">
            <img
              src="/images/cocktail-favicon.png"
              alt="Cocktail"
              width="50"
              height="50"
            />Cocktails</a
          >

          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 d-flex gap-1">
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle text-light"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Lister selon l'ingrédient
              </a>
              <ul
                id="list-ingredients"
                class="dropdown-menu p-2"
                style="min-width: 200px"
              ></ul>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle text-light"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Lister entre deux prix
              </a>
              <ul class="dropdown-menu">
                <form class="d-flex" role="search">
                  <input
                    id="price-min"
                    class="form-control mx-2"
                    type="number"
                    min="1"
                    max="100"
                    placeholder="Min"
                    aria-label="Rechercher"
                  />
                  <p class="my-auto">à</p>
                  <input
                    id="price-max"
                    class="form-control mx-2"
                    type="number"
                    min="1"
                    max="100"
                    placeholder="Max"
                    aria-label="Rechercher"
                  />
                </form>
                <div class="px-2">
                  <button
                    id="filter-price"
                    class="form-control btn btn-outline-success mt-2"
                    type="submit"
                  >
                    Filtrer
                  </button>
                </div>
              </ul>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle text-light"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Rechercher par ID
              </a>
              <ul class="dropdown-menu">
                <form class="d-flex" role="search">
                  <input
                    id="search-id"
                    class="form-control mx-2"
                    type="number"
                    min="1"
                    max="20"
                    placeholder="ID"
                    aria-label="Rechercher"
                  />
                </form>
              </ul>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle text-light"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Trier selon
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item filter" href="#">Nom (a-z)</a></li>
                <li><a class="dropdown-item filter" href="#">Nom (z-a)</a></li>
                <li>
                  <a class="dropdown-item filter" href="#">Prix (croissant)</a>
                </li>
                <li>
                  <a class="dropdown-item filter" href="#"
                    >Prix (décroissant)</a
                  >
                </li>
              </ul>
            </li>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Rechercher"
                aria-label="Rechercher"
              />
            </form>
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <h1 class="title">Catalogue des cocktails</h1>
      <div id="lst_cocktails" class="container-cards text"></div>
    </main>

    <script type="module" src="./js/app.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
